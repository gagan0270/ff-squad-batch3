<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Glory Dashboard</title>
    <style>
        :root {
            --bg-deep: #050814;
            --card-surface: rgba(15, 23, 42, 0.75);
            --card-border: rgba(56, 189, 248, 0.15);
            --accent-cyan: #38bdf8;
            --accent-blue: #0284c7;
            --success-glow: #34d399;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --gold: #fbbf24;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.08) 0%, transparent 45%),
                linear-gradient(to bottom, #030712, #050814);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Top Navigation Header matching user style */
        .top-navbar {
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 12px 18px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .nav-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-cyan);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .top-btn:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        .top-btn.stop-active {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .top-btn.stop-active:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 520px;
        }

        .premium-card {
            background: var(--card-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .premium-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.2px;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .clear-logs-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clear-logs-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .traffic-lights {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .traffic-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-red { background-color: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
        .dot-yellow { background-color: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.6); }
        .dot-green { background-color: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.6); }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: var(--success-glow);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.4); opacity: 1; box-shadow: 0 0 12px var(--success-glow); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .guild-profile-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .guild-avatar {
            width: 68px;
            height: 68px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid rgba(56, 189, 248, 0.4);
            background: #0f172a;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .guild-info h3 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .guild-meta-tags {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .tag-region {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .tag-lvl {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #030712;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .session-box {
            background: rgba(3, 7, 18, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 18px;
        }

        .session-flex {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--success-glow));
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            transition: width 0.5s ease;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: rgba(3, 7, 18, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
        }

        .metric-card span {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .metric-card strong {
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #030712;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px -4px rgba(56, 189, 248, 0.4);
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -4px rgba(56, 189, 248, 0.6);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        .terminal-logs {
            background: #02040a;
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 14px;
            padding: 16px;
            max-height: 340px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #e2e8f0;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .terminal-logs::-webkit-scrollbar {
            width: 5px;
        }
        .terminal-logs::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.2);
            border-radius: 3px;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .modal-card h3 {
            color: var(--accent-cyan);
            margin-bottom: 16px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            background: #030712;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent-cyan);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
        }

        .btn-submit {
            background: var(--accent-cyan);
            color: #030712;
        }
    </style>
</head>
<body>

    <!-- Top Header Navigation Bar (Akdom Upore Screen-er Moto) -->
    <div class="top-navbar">
        <span class="nav-title">Guild Dashboard</span>
        <div class="nav-actions">
            <button class="top-btn" onclick="openAddAccountModal()">+ Add Account</button>
            <button id="pause-toggle-btn" class="top-btn stop-active" onclick="togglePauseAll()">Stop Bot</button>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- Guild Core Card -->
        <div class="premium-card">
            <div class="card-header-flex">
                <span class="card-title">Guild Live Tracker</span>
                <div class="live-pill">
                    <span class="pulse-dot"></span> RUNNING
                </div>
            </div>

            <div class="guild-profile-row">
                <img src="https://raw.githubusercontent.com/ronobiswas874-sketch/Images/refs/heads/main/1792063565823.png" alt="Logo" class="guild-avatar" onerror="this.src='https://via.placeholder.com/64/0f172a/38bdf8?text=G';">
                <div class="guild-meta">
                    <h3 id="info-clan-name">ＧＳＹ✦ＦＡＬＣØＮ</h3>
                    <div class="guild-meta-tags">
                        <span>ID:<span id="info-clan-id">3055273549</span></span>
                        <span class="tag-region" id="info-clan-region">IND</span>
                        <span class="tag-lvl">LV.<span id="info-clan-level">0</span></span>
                    </div>
                </div>
            </div>

            <div class="session-box">
                <div class="session-flex">
                    <span>Active Session Uptime</span>
                    <span id="session-countdown" style="color: #38bdf8;">00h 00m 00s</span>
                </div>
                <div class="progress-track">
                    <div class="progress-bar" id="session-progress-bar"></div>
                </div>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <span>Initial</span>
                    <strong id="info-clan-xp-old" style="color: var(--text-main);">0</strong>
                </div>
                <div class="metric-card">
                    <span>Current</span>
                    <strong id="info-clan-xp-live">0</strong>
                </div>
                <div class="metric-card">
                    <span>Gained</span>
                    <strong id="info-clan-xp-gained" style="color: #34d399;">+0</strong>
                </div>
            </div>

            <button class="action-btn" onclick="refreshAllData()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.73-5.73"/></svg>
                Refresh Data
            </button>
        </div>

        <!-- Terminal Logs Card with Traffic Lights & Clear Button -->
        <div class="premium-card">
            <div class="card-header-flex" style="margin-bottom: 14px; padding-bottom: 10px;">
                <span class="card-title">System Activity Logs</span>
                <div class="header-actions">
                    <button class="clear-logs-btn" onclick="clearLogs()">Clear</button>
                    <div class="traffic-lights">
                        <span class="traffic-dot dot-red"></span>
                        <span class="traffic-dot dot-yellow"></span>
                        <span class="traffic-dot dot-green"></span>
                    </div>
                </div>
            </div>
            <div class="terminal-logs" id="bot-logs">
                <span style="color: #38bdf8;">[System]</span> Initializing secure connection...<br>
                <span style="color: #34d399;">[API]</span> Synchronizing live logs...
            </div>
        </div>
    </div>

    <!-- Add Account Modal -->
    <div class="modal-overlay" id="addAccountModal">
        <div class="modal-card">
            <h3>Add New Account</h3>
            <div class="form-group">
                <label>Account UID</label>
                <input type="text" id="modalUidInput" class="form-input" placeholder="Enter UID">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="modalPasswordInput" class="form-input" placeholder="Enter Password">
            </div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeAddAccountModal()">Cancel</button>
                <button class="modal-btn btn-submit" onclick="submitAddAccount()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_CLAN_ID = "3055273549";
        const DEFAULT_REGION = "IND";
        let autoRefreshTimer = null;
        let isAllPaused = false;

        function formatUptime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return `${String(hours).padStart(2, '0')}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
        }

        async function fetchGuildInfo() {
            try {
                const guildRes = await fetch(`/api/guildinfo?guild_id=${DEFAULT_CLAN_ID}&region=${DEFAULT_REGION}&key=XEROX_MODS`, {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json'}
                });
                
                if (!guildRes.ok) return;

                const responseJson = await guildRes.json();
                const guildData = responseJson.api_response ? responseJson.api_response.clan_basic_info : responseJson;
                
                if (guildData) {
                    const currentXp = Number(guildData['Total guild xp'] || guildData['xp'] || 0);
                    const baselineXp = Number(guildData.old_xp || currentXp);
                    const gainedXp = Number(guildData.gained_exp || 0);
                    const clanLevel = guildData.clan_level || '1';

                    document.getElementById('info-clan-name').textContent = guildData.clan_name || 'N/H';
                    document.getElementById('info-clan-id').textContent = guildData.clan_id || DEFAULT_CLAN_ID;
                    document.getElementById('info-clan-region').textContent = guildData.region || DEFAULT_REGION;
                    document.getElementById('info-clan-level').textContent = clanLevel;
                    
                    document.getElementById('info-clan-xp-old').textContent = baselineXp.toLocaleString();
                    document.getElementById('info-clan-xp-live').textContent = currentXp.toLocaleString();
                    document.getElementById('info-clan-xp-gained').textContent = (gainedXp >= 0 ? `+${gainedXp}` : gainedXp).toLocaleString();
                }
            } catch (err) {
                console.error('Error fetching guild info:', err);
            }
        }

        async function fetchStatsAndUptime() {
            try {
                const res = await fetch('/api/stats', {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json'}
                });
                if (!res.ok) return;
                const stats = await res.json();
                
                const uptimeSec = stats.uptime || 0;
                document.getElementById('session-countdown').textContent = formatUptime(uptimeSec);
                
                const maxCycle = 43200;
                const pct = Math.min(100, ((uptimeSec % maxCycle) / maxCycle) * 100);
                document.getElementById('session-progress-bar').style.width = pct + '%';
            } catch (err) {
                console.error('Error fetching stats:', err);
            }
        }

        async function fetchLogs() {
            try {
                const logsRes = await fetch('/api/logs', {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json'}
                });
                if (!logsRes.ok) return;

                const logsJson = await logsRes.json();
                const logsBox = document.getElementById('bot-logs');
                
                if (logsJson.logs) {
                    if (Array.isArray(logsJson.logs)) {
                        logsBox.innerHTML = logsJson.logs.join('<br>');
                    } else {
                        logsBox.innerHTML = logsJson.logs;
                    }
                    logsBox.scrollTop = logsBox.scrollHeight;
                }
            } catch (err) {
                console.error('Error fetching logs:', err);
            }
        }

        async function clearLogs() {
            try {
                const res = await fetch('/api/logs/clear', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                if (res.ok) {
                    document.getElementById('bot-logs').innerHTML = '<span style="color: #38bdf8;">[System]</span> Logs cleared.';
                }
            } catch (err) {
                console.error('Error clearing logs:', err);
            }
        }

        function openAddAccountModal() {
            document.getElementById('addAccountModal').style.display = 'flex';
        }

        function closeAddAccountModal() {
            document.getElementById('addAccountModal').style.display = 'none';
            document.getElementById('modalUidInput').value = '';
            document.getElementById('modalPasswordInput').value = '';
        }

        async function submitAddAccount() {
            const uid = document.getElementById('modalUidInput').value.trim();
            const password = document.getElementById('modalPasswordInput').value.trim();
            if (!uid || !password) {
                alert('Please enter both UID and Password');
                return;
            }

            try {
                const res = await fetch('/api/account/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid, password })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    alert('Account added successfully!');
                    closeAddAccountModal();
                    refreshAllData();
                } else {
                    alert('Error: ' + (data.error || 'Failed to add account'));
                }
            } catch (err) {
                console.error('Add account error:', err);
            }
        }

        async function togglePauseAll() {
            const btn = document.getElementById('pause-toggle-btn');
            const endpoint = isAllPaused ? '/api/account/restart' : '/api/account/pause_all';
            
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    isAllPaused = !isAllPaused;
                    if (isAllPaused) {
                        btn.textContent = 'Restart Bot';
                        btn.classList.remove('stop-active');
                    } else {
                        btn.textContent = 'Stop Bot';
                        btn.classList.add('stop-active');
                    }
                    refreshAllData();
                }
            } catch (err) {
                console.error('Toggle pause/restart error:', err);
            }
        }

        async function sendAutomaticJoinRequest() {
            try {
                await fetch('/api/clanjoin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ clan_id: DEFAULT_CLAN_ID })
                });
            } catch (err) {
                console.error('Join request error:', err);
            }
        }

        async function refreshAllData() {
            await fetchGuildInfo();
            await fetchStatsAndUptime();
            await fetchLogs();
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await sendAutomaticJoinRequest();
            await refreshAllData();

            if (autoRefreshTimer) clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(refreshAllData, 10000);
        });
    </script>
</body>
</html>
